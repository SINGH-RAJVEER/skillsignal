{
	"name": "Deploy",
	"on": {
		"push": { "branches": ["main"] },
		"workflow_dispatch": null
	},
	"permissions": { "contents": "read" },
	"concurrency": { "group": "cloudflare-production", "cancel-in-progress": false },
	"jobs": {
		"migrate": {
			"if": "github.ref == 'refs/heads/main'",
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 10,
			"environment": { "name": "cloudflare-production" },
			"env": { "DATABASE_URL": "${{ secrets.DATABASE_URL }}" },
			"steps": [
				{
					"name": "Require the database URL",
					"run": "test -n \"$DATABASE_URL\" || { echo '::error::Set the DATABASE_URL secret on the cloudflare-production environment.'; exit 1; }"
				},
				{ "uses": "actions/checkout@v4" },
				{ "uses": "actions/setup-go@v5", "with": { "go-version-file": "go.work", "cache-dependency-path": "**/go.sum" } },
				{ "name": "Apply database migrations", "run": "go run ./apps/migrate/cmd/migrate" }
			]
		},
		"deploy": {
			"needs": ["migrate"],
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 30,
			"environment": { "name": "cloudflare-production", "url": "${{ vars.PUBLIC_URL }}" },
			"steps": [
				{ "uses": "actions/checkout@v4" },
				{ "uses": "actions/setup-node@v4", "with": { "node-version": "24" } },
				{ "uses": "oven-sh/setup-bun@v2", "with": { "bun-version-file": "package.json" } },
				{ "run": "bun install --frozen-lockfile" },
				{
					"name": "Build the web client",
					"env": { "VITE_API_URL": "" },
					"run": "bun run --cwd apps/web build"
				},
				{
					"name": "Deploy the Worker, assets, Containers, and runtime secrets",
					"working-directory": "apps/edge",
					"env": {
						"CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
						"CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
						"DATABASE_URL": "${{ secrets.DATABASE_URL }}",
						"JWT_SECRET": "${{ secrets.JWT_SECRET }}",
						"OBJECT_STORAGE_TOKEN": "${{ secrets.OBJECT_STORAGE_TOKEN }}",
						"OBJECT_STORAGE_READ_TOKEN": "${{ secrets.OBJECT_STORAGE_READ_TOKEN }}",
						"OPENROUTER_API_KEY": "${{ secrets.OPENROUTER_API_KEY }}",
						"RAZORPAY_KEY_ID": "${{ secrets.RAZORPAY_KEY_ID }}",
						"RAZORPAY_KEY_SECRET": "${{ secrets.RAZORPAY_KEY_SECRET }}",
						"RAZORPAY_WEBHOOK_SECRET": "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}",
						"ADMIN_TOKEN": "${{ secrets.ADMIN_TOKEN }}"
					},
					"run": "set -euo pipefail\nsecrets=\"$RUNNER_TEMP/worker-secrets.json\"\ntrap 'rm -f \"$secrets\"' EXIT\numask 077\njq -n 'env | {DATABASE_URL, JWT_SECRET, OBJECT_STORAGE_TOKEN, OBJECT_STORAGE_READ_TOKEN, OPENROUTER_API_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, ADMIN_TOKEN} | with_entries(select((.value // \"\") != \"\"))' > \"$secrets\"\nbun run deploy --secrets-file \"$secrets\"\n"
				},
				{
					"name": "Wait for every backend process to become ready",
					"run": "curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 90 \"$PUBLIC_URL/readyz\"",
					"env": { "PUBLIC_URL": "${{ vars.PUBLIC_URL }}" }
				},
				{
					"name": "Check the web client",
					"run": "curl --fail --silent --show-error --max-time 30 \"$PUBLIC_URL/\" | grep -q '<div id=\"root\"'",
					"env": { "PUBLIC_URL": "${{ vars.PUBLIC_URL }}" }
				}
			]
		}
	}
}
