{
	"name": "Checks",
	"on": {
		"pull_request": { "branches": ["main"] },
		"workflow_dispatch": null
	},
	"permissions": { "contents": "read" },
	"concurrency": { "group": "checks-${{ github.ref }}", "cancel-in-progress": true },
	"jobs": {
		"test-and-build": {
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 30,
			"env": { "CGO_ENABLED": "0" },
			"services": {
				"postgres": {
					"image": "docker.io/library/postgres:18-alpine",
					"env": { "POSTGRES_PASSWORD": "password", "POSTGRES_DB": "skillsignal" },
					"ports": ["5432:5432"],
					"options": "--health-cmd \"pg_isready -U postgres -d skillsignal\" --health-interval 5s --health-timeout 5s --health-retries 20"
				}
			},
			"steps": [
				{ "uses": "actions/checkout@v4" },
				{ "uses": "actions/setup-go@v5", "with": { "go-version-file": "go.work", "cache-dependency-path": "**/go.sum" } },
				{ "uses": "oven-sh/setup-bun@v2", "with": { "bun-version-file": "package.json" } },
				{ "run": "bun install --frozen-lockfile" },
				{ "name": "Typecheck", "run": "bun run typecheck" },
				{ "name": "Test the edge Worker", "run": "bun run --cwd apps/edge test" },
				{ "name": "Build the web client", "run": "bun run --cwd apps/web build" },
				{
					"name": "Apply migrations to a fresh database",
					"env": { "DATABASE_URL": "postgresql://postgres:password@127.0.0.1:5432/skillsignal" },
					"run": "go run ./apps/migrate/cmd/migrate"
				},
				{
					"name": "Vet Go modules",
					"run": "go vet ./packages/... ./apps/migrate/... ./apps/gateway/... ./apps/worker/... ./apps/identity/... ./apps/hiring/... ./apps/documents/... ./apps/evaluation/... ./apps/billing/... ./apps/supervisor/..."
				},
				{
					"name": "Test Go modules",
					"env": { "TEST_DATABASE_URL": "postgresql://postgres:password@127.0.0.1:5432/skillsignal" },
					"run": "go test -p 1 ./packages/... ./apps/migrate/... ./apps/gateway/... ./apps/worker/... ./apps/identity/... ./apps/hiring/... ./apps/documents/... ./apps/evaluation/... ./apps/billing/... ./apps/supervisor/..."
				}
			]
		},
		"infrastructure": {
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 20,
			"steps": [
				{ "uses": "actions/checkout@v4" },
				{ "uses": "actions/setup-go@v5", "with": { "go-version-file": "go.work", "cache": false } },
				{ "uses": "actions/setup-node@v4", "with": { "node-version": "24" } },
				{ "uses": "oven-sh/setup-bun@v2", "with": { "bun-version-file": "package.json" } },
				{ "name": "Validate Actions workflows", "run": "go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/*.yml" },
				{ "run": "bun install --frozen-lockfile" },
				{ "name": "Build the web client", "run": "bun run --cwd apps/web build", "env": { "VITE_API_URL": "" } },
				{ "name": "Build the Container image and dry-run the Worker", "run": "bun run --cwd apps/edge check" }
			]
		}
	}
}
