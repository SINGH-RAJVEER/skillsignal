services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: skillsignal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores data below a versioned directory; mount the
      # parent so both Docker and rootless Podman handle upgrades correctly.
      - postgres_data:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillsignal"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SKILLSIGNAL_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skillsignal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      STORAGE_ROOT: /var/lib/skillsignal
      PORT: "8000"
    volumes:
      - resume_storage:/var/lib/skillsignal:Z
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skillsignal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_ROOT: /var/lib/skillsignal
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - resume_storage:/var/lib/skillsignal:Z
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${SKILLSIGNAL_WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  resume_storage:
