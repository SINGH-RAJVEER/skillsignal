x-domain-service: &domain-service
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &domain-environment
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skillsignal
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    STORAGE_ROOT: /var/lib/skillsignal
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    POINTS_PER_USD: ${POINTS_PER_USD:-1000}
    MIN_POINTS_INDEPENDENT_EVALUATION: ${MIN_POINTS_INDEPENDENT_EVALUATION:-10}
    MIN_POINTS_EMPLOYER_RESUME: ${MIN_POINTS_EMPLOYER_RESUME:-5}
    PRICE_CEILING_INPUT_USD_PER_MILLION: ${PRICE_CEILING_INPUT_USD_PER_MILLION:-3.0}
    PRICE_CEILING_OUTPUT_USD_PER_MILLION: ${PRICE_CEILING_OUTPUT_USD_PER_MILLION:-15.0}
    INDEPENDENT_RETENTION_DAYS: ${INDEPENDENT_RETENTION_DAYS:-30}
    PORT: "8080"
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=16m
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: skillsignal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillsignal"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/migrate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skillsignal
    restart: "no"

  identity:
    <<: *domain-service
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    environment:
      <<: *domain-environment
      JWT_TTL: ${JWT_TTL:-168h}
      RETENTION_SWEEP_INTERVAL_SECONDS: ${RETENTION_SWEEP_INTERVAL_SECONDS:-3600}

  hiring:
    <<: *domain-service
    build:
      context: .
      dockerfile: apps/hiring/Dockerfile
    volumes:
      - resume_storage:/var/lib/skillsignal:Z

  documents:
    <<: *domain-service
    build:
      context: .
      dockerfile: apps/documents/Dockerfile
    volumes:
      - resume_storage:/var/lib/skillsignal:Z

  evaluation:
    <<: *domain-service
    build:
      context: .
      dockerfile: apps/evaluation/Dockerfile
    volumes:
      - resume_storage:/var/lib/skillsignal:Z

  billing:
    <<: *domain-service
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    environment:
      <<: *domain-environment
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PACKS: ${RAZORPAY_PACKS:-}
      ENTERPRISE_SALES_EMAIL: ${ENTERPRISE_SALES_EMAIL:-sales@skillsignal.app}

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    depends_on:
      identity:
        condition: service_healthy
      hiring:
        condition: service_healthy
      documents:
        condition: service_healthy
      evaluation:
        condition: service_healthy
      billing:
        condition: service_healthy
    ports:
      - "${SKILLSIGNAL_API_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      IDENTITY_URL: http://identity:8080
      HIRING_URL: http://hiring:8080
      DOCUMENTS_URL: http://documents:8080
      EVALUATION_URL: http://evaluation:8080
      BILLING_URL: http://billing:8080
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  parser-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skillsignal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_ROOT: /var/lib/skillsignal
      WORKER_ROLE: parser
    volumes:
      - resume_storage:/var/lib/skillsignal:ro,Z
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  inference-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *domain-environment
      WORKER_ROLE: inference
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EXTRACTION_MODEL: ${OPENROUTER_EXTRACTION_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_ASSESSMENT_MODEL: ${OPENROUTER_ASSESSMENT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      OPENROUTER_EXTRACTION_FALLBACKS: ${OPENROUTER_EXTRACTION_FALLBACKS-liquid/lfm-2.5-2.6b:free}
      OPENROUTER_ASSESSMENT_FALLBACKS: ${OPENROUTER_ASSESSMENT_FALLBACKS-liquid/lfm-2.5-2.6b:free}
      OPENROUTER_EMBEDDING_FALLBACKS: ${OPENROUTER_EMBEDDING_FALLBACKS-liquid/lfm-2.5-embedding-350m:free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-4096}
    volumes:
      - resume_storage:/var/lib/skillsignal:Z
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${SKILLSIGNAL_WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  resume_storage:
